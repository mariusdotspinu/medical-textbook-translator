spring:
  application:
    name: med-textbook-learning

  # Tomcat request threads on virtual threads. Note this does NOT make the
  # extraction pipeline use virtual threads - that stays on a bounded platform
  # pool on purpose (PDF parsing is CPU/memory heavy; see ExtractionExecutorConfig).
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      # 0 => Tomcat spools straight to a temp file instead of buffering in heap.
      file-size-threshold: 0

  datasource:
    # Port 5433 to avoid colliding with an existing local Postgres on 5432.
    # Override with SPRING_DATASOURCE_URL to point at another database.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/medlearn}
    username: ${SPRING_DATASOURCE_USERNAME:medlearn}
    password: ${SPRING_DATASOURCE_PASSWORD:medlearn}
    hikari:
      # Ingestion runs one DB connection per extraction worker during batch writes,
      # plus request threads. Comfortably above the extraction pool's ceiling of 8.
      maximum-pool-size: 16

  # Disabled: this machine has the standalone docker-compose binary but not the
  # `docker compose` CLI plugin that Boot's integration requires. Start the database
  # with `docker-compose up -d` instead; set this to true where the plugin exists.
  docker:
    compose:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # 8090 rather than 8080: this is a local-first tool and 8080 is usually occupied.
  port: ${SERVER_PORT:8090}
  # A 500MB upload over a slow link needs more than the default.
  tomcat:
    connection-timeout: 5m
    max-swallow-size: -1

medlearn:
  blob-store:
    root: ./data/blobs
  ingestion:
    # 0 = auto: min(availableProcessors, 8). Each worker holds its own PDDocument
    # handle, so this bounds peak memory as much as it bounds CPU.
    extraction-parallelism: 0
    page-write-batch-size: 100
  fonts:
    # Searched first; system font directories are the fallback. CJK faces are ~20MB each and
    # are not bundled - drop Noto Sans CJK here to translate into Chinese, Japanese or Korean.
    dir: ./fonts

  translation:
    max-chars-per-batch: 24000
    # Concurrent translation requests across ALL jobs together (one shared limit, not per
    # job). This exists to respect the account's rate limit, which is the real throughput
    # ceiling; virtual threads do not raise it.
    max-in-flight: 8
    length-ratio-min: 0.4
    length-ratio-max: 2.5

  anthropic:
    # Empty is fine: the app starts without it and dry runs still work. Set ANTHROPIC_API_KEY
    # to enable live translation.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5

logging:
  level:
    com.medlearn: INFO
    org.apache.pdfbox: WARN
